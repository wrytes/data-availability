# Two isolated "regions" (separate overlay subnets) joined only by bridge nodes.
#   node-a  ->  region-a
#   node-b  ->  region-b
#   bridge  ->  region-a + region-b   (sees everything; use these as clients)
# Scale any of them:  docker service scale da_node-a=20
x-node: &node
  image: da:dev
  volumes: [da-data:/data]
  environment: &env
    REPLICATION: "2"
    LOSS: "0"          # simulated inbound UDP loss, e.g. "0.2"
    MAX_BYTES: "268435456"
    DATA_DIR: /data                                   # shards + node id survive restarts
    NODE_NAME: "{{.Service.Name}}-{{.Task.Slot}}"      # stable per-replica subdirectory
    REPAIR_INTERVAL: "10"                              # seconds between repair sweeps
    ONION: "1"             # client requests travel over 3-hop onion routes (2 = never fall back to direct)
    ONION_DELAY_MS: "20"   # max random delay each relay adds
    COVER_RATE: "0.5"      # dummy onion packets per second per node

services:
  node-a:
    <<: *node
    environment:
      <<: *env
      DISCOVER: tasks.node-a,tasks.bridge
    networks: [region-a]
    deploy: { replicas: 4 }
  node-b:
    <<: *node
    environment:
      <<: *env
      DISCOVER: tasks.node-b,tasks.bridge
    networks: [region-b]
    deploy: { replicas: 4 }
  bridge:
    <<: *node
    environment:
      <<: *env
      DISCOVER: tasks.node-a,tasks.node-b,tasks.bridge
    networks: [region-a, region-b]
    deploy: { replicas: 2 }

volumes:
  da-data: {}

networks:
  region-a:
    driver: overlay
    ipam: { config: [{ subnet: 10.77.1.0/24 }] }
  region-b:
    driver: overlay
    ipam: { config: [{ subnet: 10.77.2.0/24 }] }
